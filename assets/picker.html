<header class="app-header"><div><h1 id="project-title">Chọn chữ & thành phần</h1><p class="tiny muted">Chọn theo từng cảnh. Xác nhận một lần ở thanh dưới cùng.</p></div><div class="header-actions"><button id="browse-all" disabled>Thư viện</button><button class="quiet" id="cancel">Đóng</button></div></header>
<div id="startup" role="status">Đang tải kịch bản và thư viện trên máy…</div>
<div class="workspace hidden" id="workspace"><aside class="frames" id="frames" aria-label="Các cảnh"></aside><main id="frame-content" tabindex="-1"></main></div>
<footer class="footer hidden" id="footer"><div><div class="footer-title"><span id="progress"></span><span id="remaining"></span></div><p id="notice" role="status">Lựa chọn được tự lưu nháp trên máy.</p></div><div class="footer-actions"><button class="quiet" id="next-missing">Chọn phần còn thiếu</button><button id="review">Xem lại tất cả</button><button class="primary" id="confirm" disabled>Xác nhận & dựng tiếp</button></div></footer>
<dialog id="gallery" aria-labelledby="gallery-title"><div class="dialog-head"><div><h2 id="gallery-title">Thư viện</h2><p class="tiny muted" id="gallery-hint"></p></div><button id="close-gallery">Về kịch bản</button></div><div class="gallery-layout"><nav class="gallery-nav" id="gallery-nav" aria-label="Danh mục thư viện"></nav><div class="dialog-body" id="gallery-scroll"><div id="gallery-list"><div class="filters"><select id="category" aria-label="Loại thành phần"></select><select id="direction" aria-label="Loại chuyển động chữ"><option value="">Tất cả chuyển động</option><option value="in">Vào</option><option value="out">Ra</option><option value="loop">Lặp</option></select><input type="search" id="search" placeholder="Tìm tên mẫu, font hoặc hiệu ứng…" aria-label="Tìm thành phần CapCut"></div><p class="tiny muted" id="gallery-count"></p><div class="catalogue" id="catalogue"></div><div class="pagination"><button id="previous">Trang trước</button><span class="tiny muted" id="page-label"></span><button id="next">Trang sau</button></div></div><div class="detail-pane hidden" id="asset-detail-content"></div></div></div><div class="dialog-footer"><p class="tiny muted" id="gallery-footer-hint">Bấm “Chọn” ở một mẫu để gán vào cảnh và quay về kịch bản.</p><button id="done-gallery">Xong, về kịch bản</button></div></dialog>
<script nonce="__CSP_NONCE__">

const $=id=>document.getElementById(id);

function updateProgress(){const slots=slotEntries(),missing=slots.filter(({slot})=>slotErrors(slot).length);const done=slots.length-missing.length;const scenes=new Set(missing.map(x=>x.frame.id)).size;$('progress').textContent=done+'/'+slots.length+' thành phần đã chọn';$('remaining').textContent=confirmed?'Đã xác nhận':missing.length?'Còn '+scenes+' cảnh cần chọn bổ sung':'Đã đủ lựa chọn · sẵn sàng dựng';$('confirm').disabled=confirmed||submitting||missing.length>0;$('confirm').textContent=confirmed?'Đã xác nhận':submitting?'Đang lưu…':'Xác nhận & dựng tiếp';$('next-missing').classList.toggle('hidden',confirmed||!missing.length);$('review').textContent=viewMode==='review'?'Về chọn theo cảnh':'Xem lại tất cả';if(confirmed)notice('Đã gửi lựa chọn cho bước dựng. Bạn có thể đóng cửa sổ.');}

function goMissing(){const first=slotEntries().find(({slot})=>slotErrors(slot).length);if(first)goFrame(state.request.frames.indexOf(first.frame));}

function component(slot,part,category,direction){const c=choices[slot.id]||{},key=direction?c.animations?.[direction]:c[part];const box=el('div','component'+(key?' selected':''));box.dataset.part=direction||part;const text=el('div');text.append(el('span','label',componentLabels[direction||part]),el('span','name',key?'✓ '+name(key):part==='style'?'Font, màu, viền và nền':part==='template'?'Bố cục và hiệu ứng có sẵn':'Chưa thêm'));const actions=el('div','row');const choose=button(key?'Đổi':part==='style'?'Chọn kiểu chữ':part==='template'?'Chọn mẫu chữ':'Thêm',()=>openGallery(slot,part,category,direction),key?'':'primary');choose.disabled=confirmed||!!c.skip;actions.append(choose);if(key){const clear=button('Bỏ',()=>{if(direction)delete choices[slot.id].animations[direction];else delete choices[slot.id][part];render();},'quiet');clear.disabled=confirmed;actions.append(clear);}box.append(text,actions);return box;}
function renderSlot(slot){const root=el('section','slot');root.dataset.slotId=slot.id;const head=el('div','slot-head');head.append(el('h3','',slot.label||slot.id),el('span','tag',slot.required?'Cần chọn':'Có thể bỏ qua'));root.append(head);if(slot.text)root.append(el('p','slot-text',slot.text));const c=choices[slot.id]||{};
 if(c.skip)root.append(el('p','muted','Bạn đã bỏ qua thành phần này.'));
 else if(slot.role==='text'){
  root.append(el('h3','step-heading','1. Chọn cách hiển thị chữ'),el('p','step-hint','Chỉ cần chọn một: Kiểu chữ để tự phối, hoặc Mẫu chữ có sẵn.'));
  const base=el('div','base-options');if(slot.categories.includes('text_style'))base.append(component(slot,'style','text_style'));if(slot.categories.includes('text_template'))base.append(component(slot,'template','text_template'));root.append(base);
  if(c.template)root.append(el('p','step-hint','Đang dùng mẫu trọn bộ. Chọn Kiểu chữ nếu muốn tự phối hiệu ứng riêng.'));

   const optional=el('details','optional');const count=(c.effect?1:0)+Object.values(c.animations||{}).filter(Boolean).length;
   optional.append(el('summary','','2. Hiệu ứng & chuyển động · tùy chọn'+(count?' · đã thêm '+count:'')));
   const grid=el('div','advanced-grid');if(slot.categories.includes('text_effect'))grid.append(component(slot,'effect','text_effect'));if(slot.categories.includes('text_animation'))for(const d of ['in','out','loop'])grid.append(component(slot,'animations','text_animation',d));optional.append(grid);root.append(optional);
  }
  if(!c.style&&!c.template)root.append(el('p','inline-warning',(c.effect||Object.values(c.animations||{}).some(Boolean)?'Bạn đã thêm hiệu ứng. Cần chọn thêm Kiểu chữ ở bước 1.':'Chưa chọn cách hiển thị chữ ở bước 1.')));
 }else root.append(component(slot,'asset',slot.role==='icon'?'sticker':slot.role));
 if(slot.requirement){const detail=el('details','notes-detail');detail.append(el('summary','','Ghi chú cho thành phần này'),el('p','requirement',typeof slot.requirement==='string'?slot.requirement:JSON.stringify(slot.requirement)));root.append(detail);}
 const actions=el('div','slot-actions');if(!slot.required&&!c.skip){const skip=button('Bỏ qua thành phần này',()=>{choices[slot.id]={skip:true};render();},'quiet');skip.disabled=confirmed;actions.append(skip);}if(choices[slot.id]){const reset=button(c.skip?'Chọn lại':'Xóa lựa chọn của thành phần',()=>{delete choices[slot.id];render();},'quiet');reset.disabled=confirmed;actions.append(reset);}root.append(actions);return root;
}
function renderScene(root){const frame=state.request.frames[currentFrame];const heading=el('div','scene-heading');heading.append(el('h2','','Cảnh '+(currentFrame+1)));const nav=el('div','row');const prev=button('← Trước',()=>goFrame(currentFrame-1));prev.disabled=currentFrame===0;const next=button('Cảnh sau →',()=>goFrame(currentFrame+1));next.disabled=currentFrame===state.request.frames.length-1;nav.append(prev,next);heading.append(nav);root.append(heading);const context=el('div','context');context.append(el('h3','','Lời thoại'),el('p','',frame.dialogue||'Không có lời thoại'));if(frame.edit_notes){const detail=el('details','notes-detail');detail.append(el('summary','','Xem ghi chú dựng'),el('p','',frame.edit_notes));context.append(detail);}root.append(context);if(!frame.slots.length)root.append(el('p','empty','Cảnh này không cần chọn thêm thành phần.'));for(const slot of frame.slots)root.append(renderSlot(slot));}
function renderReview(root){root.append(el('h2','','Xem lại lựa chọn'),el('p','muted','Kiểm tra các cảnh bên dưới. Nút xác nhận luôn ở thanh cuối màn hình.'));for(const [index,frame] of state.request.frames.entries()){const block=el('section','summary-frame'),head=el('h3');head.append(el('span','','Cảnh '+(index+1)),button('Chỉnh cảnh này',()=>goFrame(index)));block.append(head);for(const slot of frame.slots){const row=el('div','summary-item'),detail=el('div');detail.append(el('p','',choiceDescription(slot,choices[slot.id])));const errors=slotErrors(slot);if(errors.length)detail.append(el('p','error',errors.join('\n')));row.append(el('p','muted',slot.label||slot.id),detail);block.append(row);}root.append(block);}}
function render(){renderFrames();const main=$('frame-content');const root=el('div','main-inner');if(confirmed)root.append(el('p','read-only','Đã xác nhận. Các lựa chọn đã được gửi cho bước dựng.'));if(viewMode==='review')renderReview(root);else renderScene(root);main.replaceChildren(root);persistDraft();updateProgress();}
function review(){viewMode=viewMode==='review'?'scene':'review';render();$('frame-content').scrollTo({top:0});}
function renderGalleryNav(){const nav=$('gallery-nav');nav.replaceChildren(el('p','gallery-nav-label','Thư viện trên máy'));const categories=target?[target.category]:['',...Object.keys(labels)];for(const category of categories){const b=button(category?labels[category]:'Tất cả',()=>{$('category').value=category;page=1;renderGalleryNav();loadGallery();});b.setAttribute('aria-pressed',String($('category').value===category));nav.append(b);}}
function showGalleryList(){ $('asset-detail-content').classList.add('hidden');$('gallery-list').classList.remove('hidden');$('gallery-scroll').scrollTo({top:0});}
function openGallery(slot=null,part=null,category=null,direction=null){target=slot?{slot,part,category,direction}:null;$('gallery-title').textContent=slot?(slot.label+' · '+(direction?componentLabels[direction]:labels[category])):'Thư viện trên máy';$('gallery-hint').textContent=slot?'Bấm Chọn để dùng cho cảnh này. Bạn có thể đổi lại sau.':'Chỉ xem thư viện. Để gán thành phần, trở về kịch bản và mở Chọn ở từng cảnh.';$('gallery-footer-hint').textContent=slot?'Chọn một mẫu → tự quay về cảnh → xác nhận ở thanh dưới cùng.':'Thành phần thiếu dữ liệu dựng chỉ có thể xem.';const categories=slot?[category]:['',...Object.keys(labels)];$('category').replaceChildren(...categories.map(c=>{const option=el('option','',c?labels[c]:'Tất cả');option.value=c;return option;}));$('category').value=category||'';$('direction').value=direction||'';$('direction').disabled=!!direction;$('search').value='';page=1;showGalleryList();renderGalleryNav();loadGallery();$('gallery').showModal();}
function provenance(entry){const sources=entry.sources||[],paths=[...new Set(sources.map(s=>typeof s==='string'?s:s.project||s.project_path||s.name||'').filter(Boolean))];if(!paths.length)return el('p','tiny muted','Chưa có dự án nguồn');const names=paths.map(p=>{const a=p.replaceAll('\\','/').split('/').filter(Boolean);return /\.json$/i.test(a.at(-1)||'')?a.at(-2):a.at(-1);});const d=el('details','provenance');d.append(el('summary','',names.slice(0,2).join(', ')+(names.length>2?' + '+(names.length-2)+' dự án':'')+' · '+(entry.occurrences||sources.length)+' lần dùng'),el('p','',paths.join('\n')));return d;}
function preview(entry){const root=el('div','preview'),media=entry.previews?.[0];if(!media){root.append(el('span','tiny',entry.category==='text_template'?'Chưa có preview toàn mẫu':'Chưa có ảnh xem trước'));return root;}const node=document.createElement(media.type.startsWith('video/')?'video':'img');node.src=media.url+'?token='+encodeURIComponent(token);if(node.tagName==='VIDEO'){node.controls=true;node.muted=true;node.playsInline=true;node.preload='metadata';}else{node.alt=entry.display_name||entry.name||entry.key;node.loading='lazy';}node.addEventListener('error',()=>root.replaceChildren(el('span','tiny','Không mở được xem trước trên máy này')));root.append(node);return root;}
function previewLabel(entry){return ({approximate_text:'Minh họa gần đúng · chưa render CapCut',capcut_cache_thumbnail:'Preview gốc từ cache CapCut',capcut_catalog_thumbnail:'Ảnh mẫu từ thư viện CapCut',capcut_project_context:'Preview trong dự án gốc',capcut_render:'Preview render từ CapCut'})[entry.preview_kind]||'';}
async function loadGallery(){const serial=++galleryRequest,category=$('category').value;const params=new URLSearchParams({category,query:$('search').value,page:String(page),page_size:'24'});const direction=$('direction').value;$('direction').classList.toggle('hidden',category!=='text_animation');if(category==='text_animation'&&direction)params.set('animation_type',direction);$('catalogue').replaceChildren(el('p','muted','Đang tải thư viện…'));try{const result=await api('/api/assets?'+params);if(serial!==galleryRequest)return;total=result.total;$('gallery-count').textContent=total+' mẫu · chỉ mẫu có đủ dữ liệu dựng mới chọn được';$('catalogue').replaceChildren();const c=target?choices[target.slot.id]||{}:{};const selected=target?(target.direction?c.animations?.[target.direction]:c[target.part]):null;for(const entry of result.entries){const available=entry.available===true&&entry.supported===true;const card=el('article','asset-card'+(available?'':' unavailable')+(entry.key===selected?' chosen':''));card.append(preview(entry));const body=el('div','asset-body');body.append(el('h3','asset-name',(entry.key===selected?'✓ Đang chọn · ':'')+(entry.display_name||entry.name||entry.key)));const label=previewLabel(entry);if(label)body.append(el('p','tiny muted',label));if(!available)body.append(el('p','tiny error',entry.supported!==true?'Chỉ xem · chưa có cấu trúc dựng':'Thiếu tài nguyên trên máy'));const actions=el('div','row');const choose=button(entry.key===selected?'Đang chọn':'Chọn',()=>chooseAsset(entry),'primary');choose.disabled=!target||!available||confirmed;actions.append(button('Xem mẫu',()=>showAssetDetail(entry)),choose);body.append(actions);card.append(body);$('catalogue').append(card);}if(!result.entries.length)$('catalogue').append(el('p','empty','Không thấy mẫu phù hợp. Thử đổi từ khóa.'));$('page-label').textContent=page+' / '+Math.max(1,Math.ceil(total/24));$('previous').disabled=page<=1;$('next').disabled=page*24>=total;}catch(error){if(serial===galleryRequest)$('catalogue').replaceChildren(el('p','error',error.message));}}
function showAssetDetail(entry){const root=$('asset-detail-content');root.replaceChildren(button('← Về danh sách mẫu',showGalleryList,'quiet'),preview(entry),el('h3','',entry.display_name||entry.name||entry.key));if(previewLabel(entry))root.append(el('p','tiny muted',previewLabel(entry)));if(!entry.previews?.length)root.append(el('p','requirement','Chưa có preview của chính mẫu này trên máy. Cần mở trong CapCut để xem đầy đủ.'));if(entry.category==='text_template')root.append(el('p','requirement',entry.template_kind==='subtitle'?'Mẫu phụ đề lấy từ dự án, giữ font và hiệu ứng của mẫu.':'Mẫu chữ lấy từ dự án trên máy.'));for(const text of (entry.sample_texts||[]).slice(0,3))if(text)root.append(el('p','slot-text',text));const original=el('details','notes-detail');original.append(el('summary','','Tên gốc trong dữ liệu CapCut'),el('p','requirement',entry.name||entry.key));root.append(original,provenance(entry));const choose=button('Chọn mẫu này',()=>chooseAsset(entry),'primary');choose.disabled=!target||entry.available!==true||entry.supported!==true||confirmed;root.append(choose);$('gallery-list').classList.add('hidden');root.classList.remove('hidden');$('gallery-scroll').scrollTo({top:0});}
function chooseAsset(entry){if(!target||confirmed)return;const {slot,part,direction}=target;if(part==='template')choices[slot.id]={template:entry.key};else{const c=choices[slot.id]&&!choices[slot.id].skip?choices[slot.id]:{};delete c.template;delete c.skip;if(direction){c.animations=c.animations||{};c.animations[direction]=entry.key;}else c[part]=entry.key;choices[slot.id]=c;}$('gallery').close();render();persistDraft();notice(draftSaved?'Đã lưu nháp. Chọn tiếp các cảnh; khi đủ, bấm Xác nhận & dựng tiếp.':'Đã chọn. Trình duyệt không lưu được nháp; hãy giữ cửa sổ mở.');}
async function confirmChoices(){if(confirmed||submitting||slotEntries().some(({slot})=>slotErrors(slot).length))return;submitting=true;updateProgress();notice('Đang gửi lựa chọn…');try{const result=await api('/api/confirm',{choices,request_hash:state.request_hash,library_hash:state.library_hash});state.session=result.session;choices=result.session.choices;confirmed=true;clearDraft();render();}catch(error){notice(error.message,true);}finally{submitting=false;updateProgress();}}
// Events.
$('browse-all').addEventListener('click',()=>openGallery());for(const id of ['close-gallery','done-gallery'])$(id).addEventListener('click',()=>$('gallery').close());$('review').addEventListener('click',review);$('next-missing').addEventListener('click',goMissing);$('confirm').addEventListener('click',confirmChoices);
$('category').addEventListener('change',()=>{page=1;renderGalleryNav();loadGallery();});$('direction').addEventListener('change',()=>{page=1;loadGallery();});$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadGallery();},220);});$('previous').addEventListener('click',()=>{if(page>1){page--;loadGallery();$('gallery-scroll').scrollTo({top:0});}});$('next').addEventListener('click',()=>{if(page*24<total){page++;loadGallery();$('gallery-scroll').scrollTo({top:0});}});
$('cancel').addEventListener('click',()=>{persistDraft();window.close();});window.addEventListener('beforeunload',event=>{persistDraft();if(!confirmed&&!draftSaved&&Object.keys(choices).length){event.preventDefault();event.returnValue='';}});
(async()=>{try{if(!token)throw new Error('Hãy mở liên kết được dịch vụ chọn thành phần trên máy cung cấp.');state=await api('/api/state');confirmed=state.session.status==='confirmed';entriesByKey=Object.fromEntries(state.library.entries.map(e=>[e.key,e]));if(confirmed)choices=state.session.choices;else restoreDraft();$('project-title').textContent=state.request.title||'Chọn chữ & thành phần';$('startup').classList.add('hidden');$('workspace').classList.remove('hidden');$('footer').classList.remove('hidden');$('browse-all').disabled=false;render();if(Object.keys(choices).length&&!confirmed)notice('Đã khôi phục bản nháp. Bạn có thể chọn tiếp rồi xác nhận ở thanh dưới cùng.');}catch(error){$('startup').textContent=error.message;$('startup').classList.add('error');}})();
</script>
