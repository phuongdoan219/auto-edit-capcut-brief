<body>
<header class="app-header"><div><h1 id="project-title">Text Effects & Stickers</h1><p class="tiny muted">Choose by scene. Confirm once using the bottom bar.</p></div><div class="header-actions"><button id="browse-all" disabled>Library</button><button class="quiet" id="cancel">Close</button></div></header>
<div id="startup" role="status">Loading your brief and local library…</div>
<div class="workspace hidden" id="workspace"><aside class="frames" id="frames" aria-label="Scenes"></aside><main id="frame-content" tabindex="-1"></main></div>
<footer class="footer hidden" id="footer"><div><div class="footer-title"><span id="progress"></span><span id="remaining"></span></div><p id="notice" role="status">Your draft is saved on this computer.</p></div><div class="footer-actions"><button class="quiet" id="next-missing">Choose Missing Items</button><button id="review">Review All</button><button class="primary" id="confirm" disabled>Confirm & Continue</button></div></footer>
<dialog id="gallery" aria-labelledby="gallery-title"><div class="dialog-head"><div><h2 id="gallery-title">Library</h2><p class="tiny muted" id="gallery-hint"></p></div><button id="close-gallery">Back to Scenes</button></div><div class="gallery-layout"><nav class="gallery-nav" id="gallery-nav" aria-label="Library categories"></nav><div class="dialog-body" id="gallery-scroll"><div id="gallery-list"><div class="filters"><select id="category" aria-label="Asset type"></select><input type="search" id="search" placeholder="Search text effects or stickers…" aria-label="Search CapCut assets"></div><p class="tiny muted" id="gallery-count"></p><div class="catalogue" id="catalogue"></div><div class="pagination"><button id="previous">Previous</button><span class="tiny muted" id="page-label"></span><button id="next">Next</button></div></div><div class="detail-pane hidden" id="asset-detail-content"></div></div></div><div class="dialog-footer"><p class="tiny muted" id="gallery-footer-hint">Choose an item to apply it to the scene.</p><button id="done-gallery">Done, Back to Scenes</button></div></dialog>
<script nonce="__CSP_NONCE__">
'use strict';
const $=id=>document.getElementById(id);
const labels={text_effect:'Text Effects',sticker:'Stickers'};
const componentLabels={effect:'Text Effect',asset:'Sticker'};
const token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('capcutPickerToken');
if(token){sessionStorage.setItem('capcutPickerToken',token);history.replaceState(null,'',location.pathname);}
let state,choices={},currentFrame=0,entriesByKey={},target=null,page=1,total=0,searchTimer,galleryRequest=0;
let confirmed=false,submitting=false,viewMode='scene',draftSaved=true;
const failedPreviewKeys=new Set();
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function button(text,action,cls=''){const node=el('button',cls,text);node.type='button';node.addEventListener('click',action);return node;}
function notice(text,error=false){$('notice').textContent=text;$('notice').className=error?'error':'';}
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+(token||''),...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not connect to the local service');return result;}
function slotEntries(){return state.request.frames.flatMap(frame=>frame.slots.map(slot=>({frame,slot})));}
function name(key){return entriesByKey[key]?.display_name||entriesByKey[key]?.name||key||'Not selected';}
function choiceDescription(slot,c){if(!c)return slot.opt_in?'No sticker added':'Not selected';if(c.skip)return 'Skipped';return (slot.role==='text'?'Text Effect: ':'Sticker: ')+name(slot.role==='text'?c.effect:c.asset);}
function slotLabel(slot){return slot.role==='text'?'Text Effect':'Stickers';}

function slotErrors(slot){const c=choices[slot.id];if(!c&&slot.opt_in)return [];if(!c)return [slotLabel(slot)+': choose an item'+(slot.required?'':' or click Skip')];if(c.skip)return slot.required?[slotLabel(slot)+': required']:[];const key=slot.role==='text'?c.effect:c.asset;if(!key)return [slotLabel(slot)+': choose an item'];const e=entriesByKey[key];if(!e||e.available!==true||e.supported!==true)return [slotLabel(slot)+': this item is no longer available; choose another'];return []; }

function draftKey(){return 'capcut-picker-draft:'+state.request_hash+':'+state.library_hash;}
function persistDraft(){if(!state||confirmed)return;try{localStorage.setItem(draftKey(),JSON.stringify({choices,currentFrame}));draftSaved=true;}catch{draftSaved=false;}}
function restoreDraft(){if(confirmed)return;try{const saved=JSON.parse(localStorage.getItem(draftKey())||'null');if(!saved||!saved.choices||typeof saved.choices!=='object'||Array.isArray(saved.choices))return;const slots=Object.fromEntries(slotEntries().map(x=>[x.slot.id,x.slot]));const restored={};for(const [sid,c]of Object.entries(saved.choices)){const slot=slots[sid];if(!slot||!c||typeof c!=='object')continue;if(c.skip===true&&!slot.required){restored[sid]={skip:true};continue;}const part=slot.role==='text'?'effect':'asset',key=c[part];if(typeof key==='string'&&entriesByKey[key])restored[sid]={[part]:key};}choices=restored;if(Number.isInteger(saved.currentFrame))currentFrame=Math.max(0,Math.min(state.request.frames.length-1,saved.currentFrame));}catch{}}

function clearDraft(){try{localStorage.removeItem(draftKey());}catch{}}
function updateProgress(){const slots=slotEntries().filter(({slot})=>!slot.opt_in||choices[slot.id]?.asset),missing=slots.filter(({slot})=>slotErrors(slot).length);const done=slots.length-missing.length,scenes=new Set(missing.map(x=>x.frame.id)).size;$('progress').textContent=done+'/'+slots.length+' items ready';$('remaining').textContent=confirmed?'Confirmed':missing.length?scenes+' scene'+(scenes===1?'':'s')+' need a selection':'All set — ready to edit';$('confirm').disabled=confirmed||submitting||missing.length>0;$('confirm').textContent=confirmed?'Confirmed':submitting?'Saving…':'Confirm & Continue';$('next-missing').classList.toggle('hidden',confirmed||!missing.length);$('review').textContent=viewMode==='review'?'Back to Scenes':'Review All';if(confirmed)notice('Your selections have been sent to the editing workflow. You can close this window.');}

function goFrame(index){currentFrame=index;viewMode='scene';render();$('frame-content').scrollTo({top:0});}
function goMissing(){const first=slotEntries().find(({slot})=>slotErrors(slot).length);if(first)goFrame(state.request.frames.indexOf(first.frame));}
function renderFrames(){const root=$('frames');root.replaceChildren(el('p','','Scenes'));state.request.frames.forEach((frame,index)=>{const slots=frame.slots.filter(slot=>!slot.opt_in||choices[slot.id]?.asset),done=slots.filter(slot=>!slotErrors(slot).length).length;const b=button('',()=>goFrame(index),'frame-button'+(index===currentFrame&&viewMode==='scene'?' active':''));b.setAttribute('aria-current',index===currentFrame&&viewMode==='scene'?'step':'false');const text=el('span');text.append(el('span','frame-title','Scene '+(index+1)),el('span','frame-description',frame.dialogue||'No dialogue'));b.append(text,el('span','frame-state'+(done===slots.length?' done':''),done===slots.length?'✓ Ready':done+'/'+slots.length));root.append(b);});}

function component(slot,part,category){const c=choices[slot.id]||{},key=c[part];const box=el('div','component'+(key?' selected':''));box.dataset.part=part;const text=el('div');text.append(el('span','label',slotLabel(slot)),el('span','name',key?'✓ '+name(key):slot.opt_in?'No sticker added':'Nothing selected yet'));const actions=el('div','row');const choose=button(key?'Change':slot.role==='text'?'Choose Text Effect':'Choose Sticker',()=>openGallery(slot,part,category),key?'':'primary');choose.disabled=confirmed||!!c.skip;actions.append(choose);if(key){const clear=button('Remove',()=>{delete choices[slot.id];render();},'quiet');clear.disabled=confirmed;actions.append(clear);}box.append(text,actions);return box;}

function renderSlot(slot){const root=el('section','slot');root.dataset.slotId=slot.id;const head=el('div','slot-head');head.append(el('h3','',slotLabel(slot)),el('span','tag',slot.required?'Required':'Optional'));root.append(head);if(slot.text)root.append(el('p','slot-text',slot.text));const c=choices[slot.id]||{};if(c.skip)root.append(el('p','muted','You skipped this item.'));else{if(slot.role==='text')root.append(el('p','step-hint','Choose one text effect. The original font stored with the effect is included.'));else if(slot.opt_in)root.append(el('p','step-hint','Optional. Add a sticker to this scene if needed.'));root.append(component(slot,slot.role==='text'?'effect':'asset',slot.role==='text'?'text_effect':'sticker'));}if(slot.requirement){const d=el('details','notes-detail');d.append(el('summary','','Editing notes'),el('p','requirement',typeof slot.requirement==='string'?slot.requirement:JSON.stringify(slot.requirement)));root.append(d);}const actions=el('div','slot-actions');if(!slot.required&&!slot.opt_in&&!c.skip){const skip=button('Skip',()=>{choices[slot.id]={skip:true};render();},'quiet');skip.disabled=confirmed;actions.append(skip);}if(choices[slot.id]&&!slot.opt_in){const reset=button(c.skip?'Choose an item':'Clear selection',()=>{delete choices[slot.id];render();},'quiet');reset.disabled=confirmed;actions.append(reset);}root.append(actions);return root;}

function renderScene(root){const frame=state.request.frames[currentFrame],heading=el('div','scene-heading');heading.append(el('h2','','Scene '+(currentFrame+1)));const nav=el('div','row'),prev=button('← Previous',()=>goFrame(currentFrame-1)),next=button('Next Scene →',()=>goFrame(currentFrame+1));prev.disabled=currentFrame===0;next.disabled=currentFrame===state.request.frames.length-1;nav.append(prev,next);heading.append(nav);root.append(heading);const tools=el('div','row scene-tools');for(const role of ['text','sticker']){const slot=frame.slots.find(s=>role==='text'?s.role==='text':['sticker','icon'].includes(s.role));if(!slot)continue;const chosen=choices[slot.id]?.[role==='text'?'effect':'asset'];const pick=button(role==='text'?(chosen?'Change Text Effect':'Choose Text Effect'):(chosen?'Change Sticker':slot.opt_in?'Add Sticker (Optional)':'Choose Sticker'),()=>openGallery(slot,role==='text'?'effect':'asset',role==='text'?'text_effect':'sticker'),role==='text'&&!chosen?'primary':'');pick.disabled=confirmed;tools.append(pick);}root.append(tools);const context=el('div','context');context.append(el('h3','','Dialogue'),el('p','',frame.dialogue||'No dialogue'));if(frame.edit_notes){const d=el('details','notes-detail');d.append(el('summary','','View editing notes'),el('p','',frame.edit_notes));context.append(d);}root.append(context);if(!frame.slots.length)root.append(el('p','empty','No text effects or stickers requested for this scene.'));for(const slot of frame.slots)root.append(renderSlot(slot));}

function renderReview(root){root.append(el('h2','','Review Selections'),el('p','muted','Review your scenes below. Confirm & Continue stays at the bottom.'));for(const [index,frame]of state.request.frames.entries()){const block=el('section','summary-frame'),head=el('h3');head.append(el('span','','Scene '+(index+1)),button('Edit Scene',()=>goFrame(index)));block.append(head);for(const slot of frame.slots){const row=el('div','summary-item'),detail=el('div');detail.append(el('p','',choiceDescription(slot,choices[slot.id])));const errors=slotErrors(slot);if(errors.length)detail.append(el('p','error',errors.join('\n')));row.append(el('p','muted',slotLabel(slot)),detail);block.append(row);}root.append(block);}}

function render(){renderFrames();const main=$('frame-content');const root=el('div','main-inner');if(confirmed)root.append(el('p','read-only','Confirmed. Your selections have been sent to the editing workflow.'));if(viewMode==='review')renderReview(root);else renderScene(root);main.replaceChildren(root);persistDraft();updateProgress();}
function review(){viewMode=viewMode==='review'?'scene':'review';render();$('frame-content').scrollTo({top:0});}
function renderGalleryNav(){const nav=$('gallery-nav');nav.replaceChildren(el('p','gallery-nav-label','Local Library'));for(const category of target?[target.category]:Object.keys(labels)){const b=button(labels[category],()=>{$('category').value=category;page=1;renderGalleryNav();loadGallery();});b.setAttribute('aria-pressed',String($('category').value===category));nav.append(b);}}

function showGalleryList(){ $('asset-detail-content').classList.add('hidden');$('gallery-list').classList.remove('hidden');$('gallery-scroll').scrollTo({top:0});}
function openGallery(slot=null,part=null,category=null){target=slot?{slot,part,category}:null;$('gallery-title').textContent=slot?('Scene '+(currentFrame+1)+' · '+labels[category]):'Text Effects & Stickers';$('gallery-hint').textContent=slot?'Select one item to apply it to this scene.':'Browse your local library. To apply an item, open Choose from a scene.';$('gallery-footer-hint').textContent=slot?'Choose an item → return to the scene → Confirm & Continue when ready.':'Items without editable CapCut data are preview only.';const categories=slot?[category]:Object.keys(labels);$('category').replaceChildren(...categories.map(c=>{const o=el('option','',labels[c]);o.value=c;return o;}));$('category').value=category||'text_effect';$('search').value='';page=1;showGalleryList();renderGalleryNav();loadGallery();$('gallery').showModal();}

function provenance(entry){const paths=[...new Set((entry.sources||[]).map(s=>typeof s==='string'?s:s.project||s.project_path||s.name||'').filter(Boolean))];if(!paths.length)return el('p','tiny muted','No source project recorded');const names=paths.map(p=>{const a=p.replaceAll('\\','/').split('/').filter(Boolean);return /\.json$/i.test(a.at(-1)||'')?a.at(-2):a.at(-1);});const d=el('details','provenance');d.append(el('summary','',names.slice(0,2).join(', ')+(names.length>2?' + '+(names.length-2)+' projects':'')+' · '+(entry.occurrences||paths.length)+' uses'),el('p','',paths.join('\n')));return d;}

function preview(entry,onFailure=()=>{}){const root=el('div','preview'),files=entry.previews||[];function show(index){if(index>=files.length){failedPreviewKeys.add(entry.key);root.replaceChildren();root.classList.add('hidden');onFailure();return;}const media=files[index],node=document.createElement(media.type.startsWith('video/')?'video':'img');node.src=media.url+'?token='+encodeURIComponent(token);if(node.tagName==='VIDEO'){node.controls=true;node.muted=true;node.playsInline=true;node.preload='metadata';}else{node.alt=entry.display_name||entry.name||entry.key;node.loading='lazy';}node.addEventListener('error',()=>show(index+1));root.replaceChildren(node);}show(0);return root;}

function previewLabel(entry){return ({approximate_text:'Approximate preview · not rendered by CapCut',capcut_cache_thumbnail:'Original CapCut cache preview',capcut_catalog_thumbnail:'CapCut library thumbnail',capcut_project_context:'Preview from the source project',capcut_render:'Rendered in CapCut'})[entry.preview_kind]||'';}

async function loadGallery(){
 const serial=++galleryRequest,params=new URLSearchParams({category:$('category').value,query:$('search').value,page:String(page),page_size:'24'});
 $('catalogue').replaceChildren(el('p','muted','Loading library…'));
 function emptyPage(){if(serial!==galleryRequest||$('catalogue').querySelector('.asset-card'))return;if(page*24<total){page++;loadGallery();}else $('catalogue').replaceChildren(el('p','empty','No viewable previews found. Try another search.'));}
 try{
  const result=await api('/api/assets?'+params);if(serial!==galleryRequest)return;total=result.total;if(page>Math.max(1,Math.ceil(total/24))){page=Math.max(1,Math.ceil(total/24));return loadGallery();}
  $('gallery-count').textContent=total+' items with preview files · unavailable previews are hidden';$('catalogue').replaceChildren();
  const c=target?choices[target.slot.id]||{}:{},selected=target?c[target.part]:null;
  for(const entry of result.entries){
   if(!entry.previews?.length||failedPreviewKeys.has(entry.key))continue;
   const available=entry.available===true&&entry.supported===true,card=el('article','asset-card'+(available?'':' unavailable')+(entry.key===selected?' chosen':''));
   card.dataset.assetKey=entry.key;
   card.append(preview(entry,()=>{if(serial===galleryRequest){card.remove();emptyPage();}}));
   const body=el('div','asset-body');body.append(el('h3','asset-name',(entry.key===selected?'✓ Selected · ':'')+(entry.display_name||entry.name||entry.key)));
   if(previewLabel(entry))body.append(el('p','tiny muted',previewLabel(entry)));
   if(!available)body.append(el('p','tiny error',entry.supported!==true?'Preview only · editable data unavailable':'Resource missing on this computer'));
   const actions=el('div','row'),choose=button(entry.key===selected?'Selected':'Choose',()=>chooseAsset(entry),'primary');choose.disabled=!target||!available||confirmed;
   actions.append(button('Preview',()=>showAssetDetail(entry)),choose);body.append(actions);card.append(body);$('catalogue').append(card);
  }
  $('page-label').textContent=page+' / '+Math.max(1,Math.ceil(total/24));$('previous').disabled=page<=1;$('next').disabled=page*24>=total;emptyPage();
 }catch(error){if(serial===galleryRequest)$('catalogue').replaceChildren(el('p','error',error.message));}
}

function showAssetDetail(entry){if(!entry.previews?.length||failedPreviewKeys.has(entry.key))return;const root=$('asset-detail-content');root.replaceChildren(button('← Back to Library',showGalleryList,'quiet'),preview(entry,()=>{showGalleryList();loadGallery();}),el('h3','',entry.display_name||entry.name||entry.key));if(previewLabel(entry))root.append(el('p','tiny muted',previewLabel(entry)));if(entry.category==='text_effect'&&entry.supported)root.append(el('p','requirement','Uses the font stored with this native text effect.'));for(const text of(entry.sample_texts||[]).slice(0,3))if(text)root.append(el('p','slot-text',text));const d=el('details','notes-detail');d.append(el('summary','','Original CapCut name'),el('p','requirement',entry.name||entry.key));root.append(d,provenance(entry));const choose=button('Choose This Item',()=>chooseAsset(entry),'primary');choose.disabled=!target||entry.available!==true||entry.supported!==true||confirmed;root.append(choose);$('gallery-list').classList.add('hidden');root.classList.remove('hidden');$('gallery-scroll').scrollTo({top:0});}

function chooseAsset(entry){if(!target||confirmed||entry.available!==true||entry.supported!==true)return;const {slot,part}=target;choices[slot.id]={[part]:entry.key};$('gallery').close();render();persistDraft();notice(draftSaved?'Draft saved. Continue choosing, then click Confirm & Continue.':'Selected. Draft storage is unavailable; keep this window open.');}

async function confirmChoices(){if(confirmed||submitting||slotEntries().some(({slot})=>slotErrors(slot).length))return;submitting=true;updateProgress();notice('Saving your selections…');try{const result=await api('/api/confirm',{choices,request_hash:state.request_hash,library_hash:state.library_hash});state.session=result.session;choices=result.session.choices;confirmed=true;clearDraft();render();}catch(error){notice(error.message,true);}finally{submitting=false;updateProgress();}}
// Events.
$('browse-all').addEventListener('click',()=>openGallery());for(const id of ['close-gallery','done-gallery'])$(id).addEventListener('click',()=>$('gallery').close());$('review').addEventListener('click',review);$('next-missing').addEventListener('click',goMissing);$('confirm').addEventListener('click',confirmChoices);
$('category').addEventListener('change',()=>{page=1;renderGalleryNav();loadGallery();});$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=1;loadGallery();},220);});$('previous').addEventListener('click',()=>{if(page>1){page--;loadGallery();$('gallery-scroll').scrollTo({top:0});}});$('next').addEventListener('click',()=>{if(page*24<total){page++;loadGallery();$('gallery-scroll').scrollTo({top:0});}});
$('cancel').addEventListener('click',()=>{persistDraft();window.close();});window.addEventListener('beforeunload',event=>{persistDraft();if(!confirmed&&!draftSaved&&Object.keys(choices).length){event.preventDefault();event.returnValue='';}});
(async()=>{try{if(!token)throw new Error('Open the link provided by your local picker service.');state=await api('/api/state');confirmed=state.session.status==='confirmed';entriesByKey=Object.fromEntries(state.library.entries.map(e=>[e.key,e]));if(confirmed)choices=state.session.choices;else restoreDraft();$('project-title').textContent=state.request.title||'Text Effects & Stickers';$('startup').classList.add('hidden');$('workspace').classList.remove('hidden');$('footer').classList.remove('hidden');$('browse-all').disabled=false;render();if(Object.keys(choices).length&&!confirmed)notice('Draft restored. Continue choosing, then confirm using the bottom bar.');}catch(error){$('startup').textContent=error.message;$('startup').classList.add('error');}})();
</script>
</body>
</html>
